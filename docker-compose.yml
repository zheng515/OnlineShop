# Application + PostgreSQL (FR71).  Start with:
#   cp .env.example .env   # then set POSTGRES_PASSWORD
#   docker compose up -d --build
# Put an HTTPS reverse proxy in front of port 8000 in production (FR56).
services:
  db:
    image: postgres:16@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      # UTF-8 locale so lower() folds non-English letters (FR16, FR68).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    image: onlineshop:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      SHOP_DATABASE_URL: postgresql://shop:${POSTGRES_PASSWORD}@db:5432/shop
      SHOP_SEED_DEMO_DATA: ${SHOP_SEED_DEMO_DATA:-0}
      SHOP_COOKIE_SECURE: ${SHOP_COOKIE_SECURE:-1}
      # Address of the reverse proxy whose X-Forwarded-For header is trusted for client IPs (FR53).
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Email (FR95, FR99). With "file", emails are written to /data/mail inside the container
      # instead of being sent; set SHOP_EMAIL_BACKEND=smtp and the SMTP settings to send them.
      SHOP_PUBLIC_URL: ${SHOP_PUBLIC_URL:-http://localhost:8000}
      SHOP_EMAIL_BACKEND: ${SHOP_EMAIL_BACKEND:-file}
      SHOP_EMAIL_FROM: ${SHOP_EMAIL_FROM:-OnlineShop <no-reply@example.com>}
      SHOP_SMTP_HOST: ${SHOP_SMTP_HOST:-}
      SHOP_SMTP_PORT: ${SHOP_SMTP_PORT:-587}
      SHOP_SMTP_USERNAME: ${SHOP_SMTP_USERNAME:-}
      SHOP_SMTP_PASSWORD: ${SHOP_SMTP_PASSWORD:-}
      SHOP_SMTP_SECURITY: ${SHOP_SMTP_SECURITY:-starttls}
    ports:
      - "${SHOP_PORT:-8000}:8000"
    volumes:
      - uploads:/data/uploads
      - mail:/data/mail
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  mail:

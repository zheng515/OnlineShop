<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot your password? · OnlineShop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="login-page">
    <div class="card login-card">
      <div class="card-body">
        <div class="login-title">
          <a class="logo" href="/shop.html" aria-label="OnlineShop">OS</a>
          <h1>Forgot your password?</h1>
        </div>
        <div id="message" class="hidden" role="alert"></div>
        <p class="muted">Enter the email address of your account and we will send you a link to choose a new password.</p>
        <form id="form" novalidate>
          <div class="field"><label for="email">Email address</label>
            <input type="text" inputmode="email" id="email" autocomplete="email" maxlength="254" required></div>
          <button type="submit" class="btn btn-lg btn-block" id="submit-btn">Send reset link</button>
        </form>
        <div class="login-links">
          <a href="/login.html">Back to login</a>
          <a href="/shop.html">Browse the shop</a>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>

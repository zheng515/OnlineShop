<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password · OnlineShop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="login-page">
    <div class="card login-card">
      <div class="card-body">
        <div class="login-title">
          <a class="logo" href="/shop.html" aria-label="OnlineShop">OS</a>
          <h1>Choose a new password</h1>
        </div>
        <div id="message" class="hidden" role="alert"></div>
        <form id="form" novalidate>
          <div class="field"><label for="password">New password</label>
            <input type="password" id="password" autocomplete="new-password" maxlength="128" required>
            <div class="field-hint">8–128 characters with at least one letter and one digit.</div></div>
          <div class="field"><label for="password-confirm">Repeat new password</label>
            <input type="password" id="password-confirm" autocomplete="new-password" maxlength="128" required></div>
          <button type="submit" class="btn btn-lg btn-block" id="submit-btn">Save new password</button>
        </form>
        <div class="login-links">
          <a href="/login.html">Back to login</a>
          <a href="/shop.html">Browse the shop</a>
        </div>
      </div>
    </div>
  </main>
  <script src="/js/common.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
